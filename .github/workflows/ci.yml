# GitHub Actions CI

name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: data_sales_test
      POSTGRES_USER: data_sales_user
      POSTGRES_PASSWORD: data_sales_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433

      ALEMBIC_DATABASE_URL: postgresql+psycopg2://data_sales_user:data_sales_password@localhost:5433/data_sales_test

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: data_sales
          POSTGRES_USER: data_sales_user
          POSTGRES_PASSWORD: data_sales_password

        ports:
          - 5433:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Create test database
        run: |
          PGPASSWORD=data_sales_password \
          psql \
            -h localhost \
            -p 5433 \
            -U data_sales_user \
            -d data_sales \
            -c "CREATE DATABASE data_sales_test;"

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Check database
        run: |
          PGPASSWORD=data_sales_password \
          psql \
            -h localhost \
            -p 5433 \
            -U data_sales_user \
            -d data_sales_test \
            -c "\dt"

      - name: Seed database
        run: |
          python -m scripts.seed_database

      - name: Run pipeline
        run: |
          python -m src.pipeline

      - name: Run tests
        run: |
          python -m pytest -q

