# GitHub Actions CI

name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: data_sales_test
      POSTGRES_USER: data_sales_user
      POSTGRES_PASSWORD: data_sales_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433

      ALEMBIC_DATABASE_URL: postgresql+psycopg2://data_sales_user:data_sales_password@localhost:5433/data_sales_test

    services:
      postgres:
        image: postgres:16

        env:
          # 🔴 ALTERADO:
          # antes: data_sales
          POSTGRES_DB: data_sales_test
          POSTGRES_USER: data_sales_user
          POSTGRES_PASSWORD: data_sales_password

        ports:
          - 5433:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # 🔴 REMOVIDO:
      # Não precisamos mais criar data_sales_test manualmente.
      # O PostgreSQL já inicia com esse banco.

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Check database
        run: |
          echo "=== TABELAS ==="

          PGPASSWORD=data_sales_password \
          psql \
            -h localhost \
            -p 5433 \
            -U data_sales_user \
            -d data_sales_test \
            -c "\dt"

      - name: Seed database
        run: |
          python -m scripts.seed_database

      - name: Diagnose database after seed
        run: |
          echo "======================================"
          echo "DATABASE APOS SEED"
          echo "======================================"

          echo ""
          echo "=== DATABASE ATUAL ==="

          PGPASSWORD=data_sales_password \
          psql \
            -h localhost \
            -p 5433 \
            -U data_sales_user \
            -d data_sales_test \
            -c "SELECT current_database();"

          echo ""
          echo "=== CLIENTES ==="

          PGPASSWORD=data_sales_password \
          psql \
            -h localhost \
            -p 5433 \
            -U data_sales_user \
            -d data_sales_test \
            -c "SELECT COUNT(*) AS clientes FROM cliente;"

          echo ""
          echo "=== PRODUTOS ==="

          PGPASSWORD=data_sales_password \
          psql \
            -h localhost \
            -p 5433 \
            -U data_sales_user \
            -d data_sales_test \
            -c "SELECT COUNT(*) AS produtos FROM produto;"

          echo ""
          echo "=== PEDIDOS ==="

          PGPASSWORD=data_sales_password \
          psql \
            -h localhost \
            -p 5433 \
            -U data_sales_user \
            -d data_sales_test \
            -c "SELECT COUNT(*) AS pedidos FROM pedido;"

          echo ""
          echo "=== ITENS PEDIDO ==="

          PGPASSWORD=data_sales_password \
          psql \
            -h localhost \
            -p 5433 \
            -U data_sales_user \
            -d data_sales_test \
            -c "SELECT COUNT(*) AS itens FROM item_pedido;"

      - name: Diagnose Python database connection
        run: |
          python -c "
          from src.database.connection import DATABASE_URL
          from sqlalchemy import text
          from src.database.connection import engine

          print('DATABASE_URL usada pelo Python:')
          print(DATABASE_URL)

          with engine.connect() as connection:
              result = connection.execute(text('SELECT current_database()'))
              print('Banco conectado pelo Python:')
              print(result.scalar())

              result = connection.execute(text('SELECT COUNT(*) FROM cliente'))
              print('Clientes vistos pelo Python:')
              print(result.scalar())

              result = connection.execute(text('SELECT COUNT(*) FROM produto'))
              print('Produtos vistos pelo Python:')
              print(result.scalar())

              result = connection.execute(text('SELECT COUNT(*) FROM pedido'))
              print('Pedidos vistos pelo Python:')
              print(result.scalar())

              result = connection.execute(text('SELECT COUNT(*) FROM item_pedido'))
              print('Itens vistos pelo Python:')
              print(result.scalar())
          "
      - name: Run pipeline
        run: |
          python -m src.pipeline
      
            - name: Diagnose Parquet after pipeline
        run: |
          echo "======================================"
          echo "PARQUET APOS PIPELINE"
          echo "======================================"

          python -c "
          import pandas as pd
          from pathlib import Path

          arquivos = [
              'data/raw/cliente.parquet',
              'data/raw/produto.parquet',
              'data/raw/pedido.parquet',
              'data/raw/item_pedido.parquet',
              'data/processed/cliente.parquet',
              'data/processed/produto.parquet',
              'data/processed/pedido.parquet',
              'data/processed/item_pedido.parquet',
              'data/warehouse/dim_cliente.parquet',
              'data/warehouse/dim_produto.parquet',
              'data/warehouse/dim_data.parquet',
              'data/warehouse/fact_vendas.parquet',
          ]

          for arquivo in arquivos:
              path = Path(arquivo)

              print()
              print(f'=== {arquivo} ===')
              print(f'Existe: {path.exists()}')

              if path.exists():
                  df = pd.read_parquet(path)
                  print(f'Registros: {len(df)}')
                  print(f'Colunas: {list(df.columns)}')
          "

      - name: Run tests
        run: |
          python -m pytest -q