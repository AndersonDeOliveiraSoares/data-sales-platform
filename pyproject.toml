[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-sales-platform"
version = "0.1.0"
description = "Data engineering portfolio project"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.16,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pytest>=8.0,<10.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=18,<25.0",
    "streamlit>=1.40,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: testes de integração com PostgreSQL",
]
